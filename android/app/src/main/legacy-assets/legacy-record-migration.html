<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>正在升级数据</title>
    <style>
      html,
      body {
        min-height: 100%;
        margin: 0;
        background: #f4f4f4;
        color: #303532;
        font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      body {
        display: grid;
        place-items: center;
      }

      p {
        margin: 0;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <p>正在升级闲鱼记录…</p>
    <script>
      const DB_NAME = 'meituan_coupon_record'
      const STORE_NAME = 'coupons'
      const BACKUP_KEY = 'meituan_coupon_record_backup_v1'
      const STATS_MONTH_STORAGE_KEY = 'meituan_coupon_stats_month'

      function readBackup() {
        try {
          const value = JSON.parse(localStorage.getItem(BACKUP_KEY) || '[]')
          return Array.isArray(value) ? value : []
        } catch {
          return []
        }
      }

      function readDatabase() {
        return new Promise((resolve) => {
          const request = indexedDB.open(DB_NAME, 1)

          request.onupgradeneeded = () => {
            const database = request.result
            if (!database.objectStoreNames.contains(STORE_NAME)) {
              database.createObjectStore(STORE_NAME, { keyPath: 'id' })
            }
          }
          request.onerror = () => resolve([])
          request.onsuccess = () => {
            const database = request.result
            if (!database.objectStoreNames.contains(STORE_NAME)) {
              database.close()
              resolve([])
              return
            }

            const transaction = database.transaction(STORE_NAME, 'readonly')
            const recordsRequest = transaction.objectStore(STORE_NAME).getAll()
            recordsRequest.onerror = () => resolve([])
            recordsRequest.onsuccess = () => {
              const records = recordsRequest.result
              resolve(Array.isArray(records) ? records : [])
            }
            transaction.oncomplete = () => database.close()
          }
        })
      }

      function timestamp(record) {
        const value = new Date(record.updatedAt || record.usedAt || record.createdAt).getTime()
        return Number.isNaN(value) ? 0 : value
      }

      function mergeRecords(...collections) {
        const records = new Map()
        collections.flat().forEach((record) => {
          if (!record || !record.id) return
          const current = records.get(record.id)
          if (!current || timestamp(record) >= timestamp(current)) {
            records.set(record.id, record)
          }
        })
        return Array.from(records.values())
      }

      async function migrate() {
        try {
          const coupons = mergeRecords(readBackup(), await readDatabase())
          const payload = JSON.stringify({
            version: 1,
            coupons,
            statsMonth: localStorage.getItem(STATS_MONTH_STORAGE_KEY) || ''
          })
          const result = window.AndroidBridge?.saveLegacyRecordData?.(payload)
          if (result === 'OK') {
            window.AndroidBridge.finishLegacyRecordMigration()
          }
        } catch {
          document.querySelector('p').textContent = '记录升级将在下次启动时重试'
        }
      }

      migrate()
    </script>
  </body>
</html>

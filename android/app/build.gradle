plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wm.personalblog'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.meituancouponrecord'
        minSdk 23
        targetSdk 35
        versionCode 5
        versionName '2.0.0'
    }

    sourceSets {
        main {
            assets.srcDirs = [file('../../dist-android')]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

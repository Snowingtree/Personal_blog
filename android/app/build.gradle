plugins {
    id 'com.android.application'
}

def wmVersionProperties = new Properties()
def wmVersionFile = rootProject.file('version.properties')
if (wmVersionFile.exists()) {
    wmVersionFile.withInputStream { wmVersionProperties.load(it) }
}

def wmVersionCode = (System.getenv('WM_ANDROID_VERSION_CODE')
    ?: wmVersionProperties.getProperty('VERSION_CODE', '5')).toInteger()
def wmVersionName = System.getenv('WM_ANDROID_VERSION_NAME')
    ?: wmVersionProperties.getProperty('VERSION_NAME', '2.0.0')

android {
    namespace 'com.wm.personalblog'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.meituancouponrecord'
        minSdk 23
        targetSdk 35
        versionCode wmVersionCode
        versionName wmVersionName
    }

    sourceSets {
        main {
            assets.srcDirs = [file('../../dist-android')]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
